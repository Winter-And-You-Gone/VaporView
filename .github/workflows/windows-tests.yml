name: Windows tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: win64_msvc2022_64
          modules: "qtserialport"
          cache: true

      - name: Configure default build
        shell: pwsh
        run: |
          $env:VAPORVIEW_QT_MSVC_PREFIX = $env:QT_ROOT_DIR
          cmake --preset windows-msvc2022-x64-release -DVAPORVIEW_ENABLE_OSGEARTH=OFF

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc2022-x64-release --parallel 2

      - name: Run tests
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            ctest --preset windows-msvc2022-x64-release-fast
          } else {
            ctest --preset windows-msvc2022-x64-release
          }
