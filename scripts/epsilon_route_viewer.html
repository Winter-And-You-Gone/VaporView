<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPSILON 原始轨迹查看器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;color:#222;background:#f5f5f5}
#app{display:flex;height:100vh;overflow:hidden}
#map{flex:1;min-width:0}
#panel{width:380px;display:flex;flex-direction:column;background:#fff;border-left:1px solid #ddd;overflow:hidden}
.panel-section{padding:8px 12px;border-bottom:1px solid #eee;flex-shrink:0}
.panel-section label{display:inline-block;font-size:12px;color:#555;margin-right:4px}
.panel-section select,.panel-section input[type=number],.panel-section input[type=text]{font-size:12px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;outline:none;width:auto;max-width:100%}
.panel-section input[type=number]{width:55px}
.panel-section select:focus,.panel-section input:focus{border-color:#4a90d9}
.btn{display:inline-block;font-size:12px;padding:4px 10px;border:1px solid #4a90d9;border-radius:3px;background:#4a90d9;color:#fff;cursor:pointer;text-align:center;white-space:nowrap}
.btn:hover{background:#3a7bc8}
.btn-sm{font-size:11px;padding:2px 6px}
.btn-outline{background:transparent;color:#4a90d9}
.btn-outline:hover{background:#e8f0fe}
.btn-danger{border-color:#d9534f;background:#d9534f}
.btn-danger:hover{background:#c9302c}
.btn-danger.btn-outline{background:transparent;color:#d9534f}
.btn-danger.btn-outline:hover{background:#fce4e4}
.file-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.file-row input[type=file]{display:none}
.file-btn{font-size:12px;padding:4px 10px;border:1px solid #bbb;border-radius:3px;background:#f0f0f0;cursor:pointer;color:#555}
.file-btn:hover{background:#e0e0e0;color:#222}
.file-name{font-size:11px;color:#888;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#progressContainer{display:none;margin-top:4px}
#progressBar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
#progressFill{height:100%;width:0%;background:#4a90d9;border-radius:3px;transition:width .15s ease}
#progressStep{font-size:11px;color:#666;margin-top:2px}
#status{padding:6px 12px;font-size:12px;flex-shrink:0;min-height:24px}
#status.ok{color:#2a7d2a}
#status.error{color:#c33}
.filter-row{display:flex;flex-wrap:wrap;gap:4px 8px;margin-bottom:4px}
.filter-row .filter-item{display:inline-flex;align-items:center;gap:2px}
.filter-row .filter-item label{font-size:11px;color:#666;white-space:nowrap}
.filter-row .filter-item input,.filter-row .filter-item select{font-size:11px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px}
.stats-grid .stat-item{display:flex;justify-content:space-between}
.stats-grid .stat-label{color:#888}
.stats-grid .stat-value{font-weight:500;font-variant-numeric:tabular-nums}
.dist-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dist-row .dist-label{font-size:12px;color:#555;white-space:nowrap}
.dist-row .dist-value{font-size:14px;font-weight:600;color:#222;font-variant-numeric:tabular-nums}
.dist-row input[type=number]{width:50px}
#tableWrap{flex:1 1 0;overflow:auto;min-height:0}
#pointTable{width:100%;border-collapse:collapse;font-size:11px}
#pointTable th{position:sticky;top:0;background:#f8f8f8;z-index:1;padding:4px 3px;border-bottom:2px solid #ddd;text-align:center;font-weight:600;color:#555;white-space:nowrap}
#pointTable td{padding:3px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap}
#pointTable tr:hover td{background:#f0f7ff}
#pointTable tr.active td{background:#fff3cd!important}
#pointTable tr.start-row td{background:#d4edda}
#pointTable tr.end-row td{background:#f8d7da}
#pointTable td .btn-sm{margin:0 1px;font-size:10px;padding:1px 4px}
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div id="status" class="ok">选择文件或文件夹开始</div>

    <!-- File loading -->
    <div class="panel-section">
      <div class="file-row">
        <button class="file-btn" onclick="document.getElementById('sessionInput').click()">📁 选记录文件夹</button>
        <button class="file-btn" onclick="document.getElementById('datInput').click()">📄 选DAT文件</button>
        <span class="file-name" id="fileName"></span>
      </div>
      <input type="file" id="sessionInput" webkitdirectory>
      <input type="file" id="datInput" accept=".dat">
      <div id="progressContainer">
        <div id="progressBar"><div id="progressFill"></div></div>
        <div id="progressStep">准备...</div>
      </div>
    </div>

    <!-- Map & Filter -->
    <div class="panel-section">
      <div class="filter-row">
        <div class="filter-item">
          <label>底图</label>
          <select id="providerSelect" onchange="switchProvider()">
            <option value="tianditu_vec">天地图矢量</option>
            <option value="tianditu_img">天地图卫星</option>
            <option value="osm">OpenStreetMap</option>
          </select>
        </div>
        <div class="filter-item">
          <label>Key</label>
          <input type="text" id="tiandituKey" value="5a0d3293c900281a37417b2e4d4d3676" size="12" onchange="switchProvider()">
        </div>
      </div>
      <div class="filter-row" style="margin-top:2px">
        <div class="filter-item">
          <label>来源</label>
          <select id="positionSource" onchange="recalc()">
            <option value="auto">auto</option>
            <option value="geodetic">geodetic</option>
            <option value="system">system</option>
            <option value="both">both</option>
          </select>
        </div>
        <div class="filter-item">
          <label>min-fix</label>
          <select id="minFix" onchange="recalc()">
            <option value="">—</option>
            <option value="3">3D</option><option value="4">DGPS</option>
            <option value="5">RTK_FLOAT</option><option value="6">RTK_FIXED</option>
            <option value="7">STATIC</option><option value="8">PPP</option>
          </select>
        </div>
        <div class="filter-item">
          <label>hacc</label>
          <input type="number" id="maxHacc" step="0.01" min="0" placeholder="不限" size="4" onchange="recalc()">
        </div>
        <div class="filter-item">
          <label>vacc</label>
          <input type="number" id="maxVacc" step="0.01" min="0" placeholder="不限" size="4" onchange="recalc()">
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-item">
          <label>跳点(m)</label>
          <input type="number" id="maxSegmentM" step="1" min="0" placeholder="不限" size="4" onchange="recalc()">
        </div>
        <div class="filter-item">
          <label>排除</label>
          <input type="text" id="excludeIndices" placeholder="如5,8-10" size="8" onchange="recalc()">
        </div>
        <div class="filter-item">
          <label>包含</label>
          <input type="text" id="includeIndices" placeholder="如1,3-5" size="8" onchange="recalc()">
        </div>
        <button class="btn btn-sm" onclick="recalc()">🔄 重算</button>
      </div>
    </div>

    <!-- Distance & Stats -->
    <div class="panel-section">
      <div class="dist-row">
        <span class="dist-label">起点</span>
        <input type="number" id="startIndex" value="1" min="1" onchange="renderDistance()">
        <span class="dist-label">终点</span>
        <input type="number" id="endIndex" value="1" min="1" onchange="renderDistance()">
        <button class="btn btn-sm" onclick="zoomToFitSelected()">📍 适配</button>
        <button class="btn btn-sm btn-outline" onclick="exportCsv()">📥 CSV</button>
      </div>
      <div class="dist-row">
        <span class="dist-label">区段:</span>
        <span class="dist-value" id="segmentDist">—</span>
        <span class="dist-label" style="margin-left:12px">全程:</span>
        <span class="dist-value" id="totalDist">—</span>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <!-- Table -->
    <div id="tableWrap"><table id="pointTable"><thead><tr>
      <th>#</th><th>操作</th><th>纬度</th><th>经度</th><th>Fix</th><th>累积(m)</th><th>hacc</th><th>vacc</th><th>UTC</th>
    </tr></thead><tbody></tbody></table></div>
  </div>
</div>

<script>
// ===================================================================
// CONSTANTS
// ===================================================================
const FRAME_HEAD = 0xFC, FRAME_TAIL = 0xFD;
const RAW_SOURCE_EPSILON = 1;
const UNIFIED_RAW_MAGIC = 'VVRAWDAT', LEGACY_EPSILON_MAGIC = 'VVEPSRAW';
const UNIFIED_RAW_RECORD_MARKER = 0x44525756;
const LEGACY_EPSILON_RECORD_MARKER = 0x524D5549;
const EARTH_RADIUS = 6371000;
const FIX_NAMES = {0:'NO_GPS',1:'NO_FIX',2:'2D',3:'3D',4:'DGPS',5:'RTK_FLOAT',6:'RTK_FIXED',7:'STATIC',8:'PPP',9:'RTK_DUAL'};
const PACKET_NAMES = {0x40:'IMU',0x41:'AHRS',0x42:'INS_GPS',0x50:'SYS_STATE',0x51:'UNIX_TIME',0x52:'FORMATTED_TIME',0x59:'RAW_GNSS',0x5A:'SATELLITES',0x5C:'GEODETIC_POS',0x5D:'ECEF_POS',0xF0:'MAVLINK_TUNNEL'};

// ===================================================================
// GLOBALS
// ===================================================================
let gRecords = [], gCandidates = [], gPoints = [], gStats = {};
let gMap = null; let gLayers = [], gMarkers = [];
let gTrackLine = null, gTrackSelected = null, gStartMarker = null, gEndMarker = null, gHoverCircle = null;
let gIsLoading = false;

// ===================================================================
// BINARY HELPERS
// ===================================================================
function rU16(dv,o){return dv.getUint16(o,true)}
function rU32(dv,o){return dv.getUint32(o,true)}
function rF32(dv,o){return dv.getFloat32(o,true)}
function rF64(dv,o){return dv.getFloat64(o,true)}
function rad2deg(r){return r*180/Math.PI}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function isFinN(v){return v!=null && Number.isFinite(v)}

// ===================================================================
// CRC
// ===================================================================
function crc8(b,s,l){let c=0;for(let i=s;i<s+l;i++){c^=b[i];for(let j=0;j<8;j++){c=(c&1)?((c>>1)^0x8C):(c>>1);c&=0xFF}}return c}
function crc16(b,s,l){let c=0;for(let i=s;i<s+l;i++){c^=b[i]<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c}

// ===================================================================
// FDILink FRAME PARSER
// ===================================================================
function parseFrame(payload){
  if(payload.byteLength<8)return null;
  const b=new Uint8Array(payload),ps=b[2],es=ps+8;
  if(b[0]!==FRAME_HEAD||payload.byteLength!==es||b[es-1]!==FRAME_TAIL)return null;
  if(crc8(b,0,4)!==b[4])return null;
  if(crc16(b,7,ps)!==((b[5]<<8)|b[6]))return null;
  return{packetId:b[1],serialNumber:b[3],payloadSize:ps,payloadView:new DataView(payload.buffer,payload.byteOffset+7,ps)};
}

function pktName(id){return '0x'+id.toString(16).toUpperCase().padStart(2,'0')+' '+(PACKET_NAMES[id]||'UNKNOWN')}
function tsUsIso(u){if(!u)return '';const ms=Math.floor(u/1000);const ex=u%1000;return new Date(ms).toISOString().replace('Z',String(ex).padStart(3,'0')+'Z')}
function epIso(s,us){return s!=null?tsUsIso(s*1000000+(us||0)):''}
function vll(lat,lon){return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180&&!(Math.abs(lat)<1e-8&&Math.abs(lon)<1e-8)}
function fmtTimeUs(payload){
  if(payload.byteLength<14)return null;
  const p=new DataView(payload.buffer,payload.byteOffset,payload.byteLength);
  try{
    const us=rU32(p,0),y=rU16(p,4),b8=new Uint8Array(payload.buffer,payload.byteOffset,payload.byteLength);
    const ms=Date.UTC(y,b8[8]-1,b8[9],b8[11],b8[12],b8[13],Math.floor(us/1000));
    return ms*1000+(us%1000);
  }catch(e){return null}
}

// ===================================================================
// RECORD ITERATORS
// ===================================================================
function iterUnifiedRaw(fn,bytes){
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  if(bytes.byteLength<20)throw new Error(fn+': 文件头过短');
  const ver=rU32(dv,8),hs=rU32(dv,12),sid=rU16(dv,16);
  if(sid!==RAW_SOURCE_EPSILON)throw new Error(fn+': source_id='+sid+' 不是 EPSILON');
  let off=hs;const recs=[];
  while(off+36<=bytes.byteLength){
    const mk=rU32(dv,off);if(mk!==UNIFIED_RAW_RECORD_MARKER)throw new Error(fn+': marker 错 off='+off);
    const rhs=rU32(dv,off+4),hts=Number(dv.getBigUint64(off+8,true)),ps=rU32(dv,off+16),rsi=rU16(dv,off+20),rt=rU16(dv,off+22),fl=rU32(dv,off+24),seq=Number(dv.getBigUint64(off+28,true));
    const po=off+rhs;if(po+ps>bytes.byteLength)throw new Error(fn+': payload 不完整');
    if(rsi===RAW_SOURCE_EPSILON)recs.push({sourceFile:fn,rawFormat:'unified_v'+ver,sequence:seq,hostTimestampUs:hts,recordType:rt,flags:fl,payload:bytes.slice(po,po+ps),recordOffset:off,payloadOffset:po});
    off=po+ps;
  }
  return recs;
}
function iterLegacyRaw(fn,bytes){
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const ver=rU32(dv,8),hs=rU32(dv,12);let off=hs,seq=0;const recs=[];
  while(off+20<=bytes.byteLength){
    const mk=rU32(dv,off);if(mk!==LEGACY_EPSILON_RECORD_MARKER)throw new Error(fn+': legacy marker 错 off='+off);
    const ps=rU32(dv,off+4),hts=Number(dv.getBigUint64(off+8,true)),ft=bytes[off+16],sr=bytes[off+17],po=off+20;
    if(po+ps>bytes.byteLength)throw new Error(fn+': payload 不完整');
    recs.push({sourceFile:fn,rawFormat:'legacy_epsilon_v'+ver,sequence:seq,hostTimestampUs:hts,recordType:ft,flags:sr,payload:bytes.slice(po,po+ps),recordOffset:off,payloadOffset:po});
    off=po+ps;seq++;
  }
  return recs;
}
function iterFdilinkStream(fn,bytes){
  let off=0,seq=0;const recs=[];
  while(off+8<=bytes.byteLength){
    while(off<bytes.byteLength&&bytes[off]!==FRAME_HEAD)off++;
    if(off+8>bytes.byteLength)break;
    const ps=bytes[off+2],fs=ps+8;
    if(off+fs>bytes.byteLength)break;
    const pay=bytes.slice(off,off+fs);
    if(pay[pay.byteLength-1]===FRAME_TAIL){
      recs.push({sourceFile:fn,rawFormat:'fdilink_stream',sequence:seq,hostTimestampUs:0,recordType:bytes[off+1],flags:bytes[off+3],payload:pay,recordOffset:off,payloadOffset:off});
      seq++;off+=fs;
    }else{off++}
  }
  return recs;
}
function parseRecords(fn,bytes){
  const m=new TextDecoder('ascii').decode(bytes.slice(0,8));
  if(m===UNIFIED_RAW_MAGIC)return iterUnifiedRaw(fn,bytes);
  if(m===LEGACY_EPSILON_MAGIC)return iterLegacyRaw(fn,bytes);
  return iterFdilinkStream(fn,bytes);
}

// ===================================================================
// DECODE POINTS
// ===================================================================
function newPoint(rec,frame,state,src){
  const fc=state.gnss_fix_code!=null?state.gnss_fix_code:null;
  return{
    source_file:rec.sourceFile,raw_format:rec.rawFormat,record_sequence:rec.sequence,
    host_timestamp_us:rec.hostTimestampUs,host_time_utc:tsUsIso(rec.hostTimestampUs),
    packet_id_hex:pktName(frame.packetId),packet_name:PACKET_NAMES[frame.packetId]||'UNKNOWN',
    position_source:src,serial_number:frame.serialNumber,
    utc_unix_s:state.utc_unix_s!=null?state.utc_unix_s:null,
    utc_microseconds:state.utc_microseconds!=null?state.utc_microseconds:null,
    epsilon_time_utc:epIso(state.utc_unix_s,state.utc_microseconds),
    latitude_deg:null,longitude_deg:null,height_m:null,
    segment_distance_m:0,cumulative_distance_m:0,
    gnss_fix_code:fc,gnss_fix:fc!=null?(FIX_NAMES[fc]||''):'',
    gnss_satellites:state.gnss_satellites!=null?state.gnss_satellites:null,
    hdop:state.hdop!=null?state.hdop:null,vdop:state.vdop!=null?state.vdop:null,
    hacc_m:state.hacc_m!=null?state.hacc_m:null,vacc_m:state.vacc_m!=null?state.vacc_m:null,
    lat_std_m:state.lat_std_m!=null?state.lat_std_m:null,lon_std_m:state.lon_std_m!=null?state.lon_std_m:null,
    height_std_m:state.height_std_m!=null?state.height_std_m:null,diff_age_s:state.diff_age_s!=null?state.diff_age_s:null,
    vel_n_mps:state.vel_n_mps!=null?state.vel_n_mps:null,vel_e_mps:state.vel_e_mps!=null?state.vel_e_mps:null,
    vel_d_mps:state.vel_d_mps!=null?state.vel_d_mps:null,
    ned_n_m:state.ned_n_m!=null?state.ned_n_m:null,ned_e_m:state.ned_e_m!=null?state.ned_e_m:null,
    ned_d_m:state.ned_d_m!=null?state.ned_d_m:null,
    roll_deg:state.roll_deg!=null?state.roll_deg:null,pitch_deg:state.pitch_deg!=null?state.pitch_deg:null,
    yaw_deg:state.yaw_deg!=null?state.yaw_deg:null,
    system_status_bits:state.system_status_bits!=null?state.system_status_bits:null,
    filter_status_bits:state.filter_status_bits!=null?state.filter_status_bits:null,
    update_status_bits:state.update_status_bits!=null?state.update_status_bits:null,
    record_offset:rec.recordOffset,payload_offset:rec.payloadOffset,
    point_index:0,source_point_index:0
  };
}

function decodePoints(records,onProgress){
  const state={};const cands=[];let vf=0,bf=0;
  for(let i=0;i<records.length;i++){
    if(onProgress&&i>0&&i%500===0)onProgress(62+(i/records.length)*23,'解码坐标点… '+i+'/'+records.length);
    const rec=records[i],frame=parseFrame(rec.payload);
    if(!frame){bf++;continue;}vf++;
    const p=frame.payloadView,pid=frame.packetId,sz=frame.payloadSize;
    if(pid===0x42&&sz>=72){
      state.ned_n_m=rF32(p,24);state.ned_e_m=rF32(p,28);state.ned_d_m=rF32(p,32);
      state.vel_n_mps=rF32(p,36);state.vel_e_mps=rF32(p,40);state.vel_d_mps=rF32(p,44);
    }else if(pid===0x50&&sz>=14){
      state.system_status_bits=rU16(p,0);state.filter_status_bits=rU16(p,2);state.update_status_bits=rU16(p,4);
      state.utc_unix_s=rU32(p,6);state.utc_microseconds=rU32(p,10);
      state.gnss_fix_code=(state.filter_status_bits>>4)&0x0F;
      if(sz>=50){state.vel_n_mps=rF32(p,38);state.vel_e_mps=rF32(p,42);state.vel_d_mps=rF32(p,46)}
      if(sz>=78){state.roll_deg=rad2deg(rF32(p,66));state.pitch_deg=rad2deg(rF32(p,70));state.yaw_deg=rad2deg(rF32(p,74))}
      if(sz>=102){state.lat_std_m=rF32(p,90);state.lon_std_m=rF32(p,94);state.height_std_m=rF32(p,98)}
      if(sz>=38){
        const pt=newPoint(rec,frame,state,'system_state');
        pt.latitude_deg=rad2deg(rF64(p,14));pt.longitude_deg=rad2deg(rF64(p,22));pt.height_m=rF64(p,30);
        cands.push(pt);
      }
    }else if(pid===0x51&&sz>=8){state.utc_unix_s=rU32(p,0);state.utc_microseconds=rU32(p,4)}
    else if(pid===0x52&&sz>=14){const utc=fmtTimeUs(new Uint8Array(p.buffer,p.byteOffset,p.byteLength));if(utc!=null){state.utc_unix_s=Math.floor(utc/1000000);state.utc_microseconds=utc%1000000}}
    else if(pid===0x59&&sz>=74){
      state.utc_unix_s=rU32(p,0);state.utc_microseconds=rU32(p,4);
      state.lat_std_m=rF32(p,44);state.lon_std_m=rF32(p,48);state.height_std_m=rF32(p,52);state.diff_age_s=rF32(p,64);
      state.gnss_fix_code=(rU16(p,72)&0x0F);
    }else if(pid===0x5A&&sz>=9){state.hdop=rF32(p,0);state.vdop=rF32(p,4);state.gnss_satellites=new Uint8Array(p.buffer,p.byteOffset,p.byteLength)[8]}
    else if(pid===0x5C&&sz>=32){
      const pt=newPoint(rec,frame,state,'geodetic_pos');
      pt.latitude_deg=rad2deg(rF64(p,0));pt.longitude_deg=rad2deg(rF64(p,8));pt.height_m=rF64(p,16);
      pt.hacc_m=rF32(p,24);pt.vacc_m=rF32(p,28);
      state.hacc_m=pt.hacc_m;state.vacc_m=pt.vacc_m;
      cands.push(pt);
    }
  }
  gStats.rawRecords=records.length;gStats.validFrames=vf;gStats.badFrames=bf;gStats.coordinateCandidates=cands.length;
  return cands;
}

// ===================================================================
// SELECT SOURCE / FILTERS / DISTANCE
// ===================================================================
function selectSource(cands,req){
  if(req==='auto')req=cands.some(p=>p.position_source==='geodetic_pos')?'geodetic':'system';
  let sel;if(req==='geodetic')sel=cands.filter(p=>p.position_source==='geodetic_pos');
  else if(req==='system')sel=cands.filter(p=>p.position_source==='system_state');
  else sel=Array.from(cands);
  sel.forEach((p,i)=>{p.source_point_index=i+1});
  gStats.selectedCandidates=sel.length;gStats.autoSource=req;
  return sel;
}

function parseRanges(text){
  if(!text||!text.trim())return null;
  const s=new Set();text.split(',').forEach(p=>{const t=p.trim();if(!t)return;if(t.indexOf('-')>=0){const[s,e]=t.split('-',2);const lo=Math.min(+s,+e),hi=Math.max(+s,+e);for(let i=lo;i<=hi;i++)s.add(i)}else{const v=parseInt(t,10);if(!isNaN(v))s.add(v)}});
  return s;
}

function applyFilters(pts,f){
  let fl=[];const inc=f.includeIndices,exc=f.excludeIndices,mfx=f.minFixCode,mha=f.maxHacc,mva=f.maxVacc,mse=f.maxSegmentM;
  for(const p of pts){
    if(inc&&inc.size>0&&!inc.has(p.source_point_index))continue;
    if(exc&&exc.has(p.source_point_index))continue;
    if(!vll(p.latitude_deg,p.longitude_deg))continue;
    if(mfx!=null&&(p.gnss_fix_code==null||p.gnss_fix_code<mfx))continue;
    if(isFinN(mha)&&isFinN(p.hacc_m)&&p.hacc_m>mha)continue;
    if(isFinN(mva)&&isFinN(p.vacc_m)&&p.vacc_m>mva)continue;
    fl.push(p);
  }
  if(isFinN(mse)&&fl.length>0){const jmp=[fl[0]];for(let i=1;i<fl.length;i++){if(haversine(jmp[jmp.length-1],fl[i])<=mse)jmp.push(fl[i])}fl=jmp}
  gStats.filteredCount=fl.length;gStats.removedCount=pts.length-fl.length;
  return fl;
}

function haversine(a,b){
  const l1=a.latitude_deg*Math.PI/180,l2=b.latitude_deg*Math.PI/180,dl=l2-l1,dn=(b.longitude_deg-a.longitude_deg)*Math.PI/180;
  const h=Math.sin(dl/2)**2+Math.cos(l1)*Math.cos(l2)*Math.sin(dn/2)**2;
  return EARTH_RADIUS*2*Math.atan2(Math.sqrt(h),Math.sqrt(Math.max(0,1-h)));
}

function assignDist(list){
  let cum=0;
  for(let i=0;i<list.length;i++){const p=list[i];p.point_index=i+1;p.segment_distance_m=i===0?0:haversine(list[i-1],p);cum+=p.segment_distance_m;p.cumulative_distance_m=cum}
}

function routeDist(list,si,ei){
  if(!list||!list.length)return 0;const lo=Math.min(si,ei),hi=Math.max(si,ei);
  if(lo===hi||hi>list.length)return 0;
  return list[hi-1].cumulative_distance_m-list[lo-1].cumulative_distance_m;
}

// ===================================================================
// CSV
// ===================================================================
const csvF=['point_index','source_point_index','source_file','raw_format','record_sequence','host_timestamp_us','host_time_utc','packet_id_hex','packet_name','position_source','serial_number','utc_unix_s','utc_microseconds','epsilon_time_utc','latitude_deg','longitude_deg','height_m','segment_distance_m','cumulative_distance_m','gnss_fix_code','gnss_fix','gnss_satellites','hdop','vdop','hacc_m','vacc_m','lat_std_m','lon_std_m','height_std_m','diff_age_s','vel_n_mps','vel_e_mps','vel_d_mps','ned_n_m','ned_e_m','ned_d_m','roll_deg','pitch_deg','yaw_deg','system_status_bits','filter_status_bits','update_status_bits','record_offset','payload_offset'];
function csvV(v){
  if(v==null)return '';if(typeof v==='number'){if(!Number.isFinite(v))return '';return v.toPrecision(10).replace(/\.?0+$/,'')}return String(v);
}
function exportCsv(){
  if(!gPoints.length){setStatus('没有可导出的数据',false);return}
  let csv='\uFEFF'+csvF.join(',')+'\n';
  for(const p of gPoints)csv+=csvF.map(f=>csvV(p[f])).join(',')+'\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='epsilon_route.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  setStatus('CSV 已导出 ('+gPoints.length+' 行)');
}

// ===================================================================
// UI HELPERS
// ===================================================================
function setStatus(msg,ok){const e=document.getElementById('status');e.textContent=msg;e.className=ok===false?'error':'ok'}
function updateProgress(pct,step){document.getElementById('progressContainer').style.display='block';document.getElementById('progressFill').style.width=Math.min(100,Math.max(0,pct))+'%';document.getElementById('progressStep').textContent=step}
function hideProgress(){document.getElementById('progressContainer').style.display='none'}

// ===================================================================
// LEAFLET: Tianditu tile helpers
// ===================================================================
// 天地图 WMTS：路径用 endpoint（vec_w/img_w），但 LAYER 查询参数用去掉 _w 的短名（vec/img）。
// 注记层 cva_w/cia_w 同理：LAYER=cva/cia。
const TD_LAYERS = {
  vec_w: { endpoint: 'vec_w', layer: 'vec' },
  cva_w: { endpoint: 'cva_w', layer: 'cva' },
  img_w: { endpoint: 'img_w', layer: 'img' },
  cia_w: { endpoint: 'cia_w', layer: 'cia' }
};

function makeTdTile(cfg) {
  const layer = L.tileLayer('', { maxZoom: 18 });
  layer.getTileUrl = function(coords) {
    const z=coords.z,x=((coords.x%Math.pow(2,z))+Math.pow(2,z))%Math.pow(2,z),y=coords.y;
    const shard=Math.abs(x*31+y*17+cfg.layer.length*13)%8;
    return 'https://t'+shard+'.tianditu.gov.cn/'+cfg.endpoint+'/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+cfg.layer+'&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILECOL='+x+'&TILEROW='+y+'&TILEMATRIX='+z+'&tk='+cfg.key;
  };
  return layer;
}

const TD_PROVIDERS={
  tianditu_vec:{base:'vec_w',anno:'cva_w'},
  tianditu_img:{base:'img_w',anno:'cia_w'},
  osm:{}
};

function switchProvider(){
  const pid=document.getElementById('providerSelect').value,key=document.getElementById('tiandituKey').value.trim()||'5a0d3293c900281a37417b2e4d4d3676',cfg=TD_PROVIDERS[pid];
  for(const l of gLayers)gMap.removeLayer(l);gLayers=[];
  if(pid==='osm'){
    gLayers.push(L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(gMap));
  }else{
    const base=makeTdTile({endpoint:TD_LAYERS[cfg.base].endpoint,layer:TD_LAYERS[cfg.base].layer,key});base.addTo(gMap);gLayers.push(base);
    const anno=makeTdTile({endpoint:TD_LAYERS[cfg.anno].endpoint,layer:TD_LAYERS[cfg.anno].layer,key});anno.addTo(gMap);gLayers.push(anno);
  }
  if(gPoints.length)renderMap();
}

function initMap(){
  gMap=L.map('map',{center:[39.9,116.3],zoom:12,zoomControl:true,attributionControl:true});
  switchProvider();
}

// ===================================================================
// MAP RENDERING
// ===================================================================
function renderMap(){
  if(gTrackLine){gMap.removeLayer(gTrackLine);gTrackLine=null}
  if(gTrackSelected){gMap.removeLayer(gTrackSelected);gTrackSelected=null}
  if(gStartMarker){gMap.removeLayer(gStartMarker);gStartMarker=null}
  if(gEndMarker){gMap.removeLayer(gEndMarker);gEndMarker=null}
  if(gHoverCircle){gMap.removeLayer(gHoverCircle);gHoverCircle=null}
  for(const m of gMarkers)gMap.removeLayer(m);gMarkers=[];
  if(!gPoints.length)return;

  const ll=gPoints.map(p=>[p.latitude_deg,p.longitude_deg]);
  gTrackLine=L.polyline(ll,{color:'#999',weight:2,opacity:0.6}).addTo(gMap);

  const si=parseInt(document.getElementById('startIndex').value,10)||1,ei=parseInt(document.getElementById('endIndex').value,10)||gPoints.length;
  const lo=Math.max(0,Math.min(si,ei)-1),hi=Math.min(gPoints.length,Math.max(si,ei));
  if(lo<hi){
    const seg=ll.slice(lo,hi);
    gTrackSelected=L.polyline(seg,{color:'#e67300',weight:3,opacity:0.9}).addTo(gMap);
    const sp=gPoints[lo];gStartMarker=L.circleMarker([sp.latitude_deg,sp.longitude_deg],{radius:8,color:'#2a7d2a',fillColor:'#4caf50',fillOpacity:0.8,weight:2}).addTo(gMap);
    gStartMarker.bindTooltip('起点 #'+(lo+1),{direction:'top'});
    const ep=gPoints[hi-1];gEndMarker=L.circleMarker([ep.latitude_deg,ep.longitude_deg],{radius:8,color:'#c33',fillColor:'#e74c3c',fillOpacity:0.8,weight:2}).addTo(gMap);
    gEndMarker.bindTooltip('终点 #'+hi,{direction:'top'});
  }

  for(let i=0;i<gPoints.length;i++){
    const p=gPoints[i],m=L.circleMarker([p.latitude_deg,p.longitude_deg],{radius:5,color:'#4a90d9',fillColor:'#4a90d9',fillOpacity:0.3,weight:1,opacity:0.4});
    m.pointIndex=i;m.on('mouseover',()=>hoverPoint(i));m.on('mouseout',()=>unhoverPoint());m.on('click',()=>clickTableRow(i));
    m.addTo(gMap);gMarkers.push(m);
  }
}

function hoverPoint(idx){
  if(gHoverCircle){gMap.removeLayer(gHoverCircle);gHoverCircle=null}
  const p=gPoints[idx];
  gHoverCircle=L.circleMarker([p.latitude_deg,p.longitude_deg],{radius:10,color:'#f39c12',fillColor:'#f1c40f',fillOpacity:0.7,weight:2}).addTo(gMap);
  const fix=p.gnss_fix||'—',h=isFinN(p.height_m)?p.height_m.toFixed(2)+' m':'—',cd=isFinN(p.cumulative_distance_m)?p.cumulative_distance_m.toFixed(3)+' m':'—';
  const tip=L.tooltip({direction:'top',offset:L.point(0,-10)}).setContent('#'+(idx+1)+' | 纬度:'+p.latitude_deg.toFixed(7)+' 经度:'+p.longitude_deg.toFixed(7)+' | 高程:'+h+' | Fix:'+fix+' | 累积:'+cd);
  gHoverCircle.bindTooltip(tip).openTooltip();
  highlightTableRow(idx);
}
function unhoverPoint(){if(gHoverCircle){gMap.removeLayer(gHoverCircle);gHoverCircle=null}clearTableHighlight()}

function zoomToFitSelected(){
  if(!gPoints.length)return;
  if(gTrackSelected)gMap.fitBounds(gTrackSelected.getBounds(),{padding:[30,30]});
  else gMap.fitBounds(gPoints.map(p=>[p.latitude_deg,p.longitude_deg]),{padding:[30,30]});
}
function zoomToPoint(idx){
  if(idx<0||idx>=gPoints.length)return;const p=gPoints[idx];gMap.setView([p.latitude_deg,p.longitude_deg],17);
}

// ===================================================================
// TABLE
// ===================================================================
function renderTable(){
  const tb=document.querySelector('#pointTable tbody');tb.innerHTML='';
  if(!gPoints.length)return;
  const si=parseInt(document.getElementById('startIndex').value,10)||1,ei=parseInt(document.getElementById('endIndex').value,10)||gPoints.length;
  for(let i=0;i<gPoints.length;i++){
    const p=gPoints[i],idx=i+1,tr=document.createElement('tr');
    tr.dataset.index=i;
    if(idx===si)tr.classList.add('start-row');
    if(idx===ei)tr.classList.add('end-row');
    const fix=p.gnss_fix||'—',cd=isFinN(p.cumulative_distance_m)?p.cumulative_distance_m.toFixed(1):'—';
    const ha=isFinN(p.hacc_m)?p.hacc_m.toFixed(3):'—',va=isFinN(p.vacc_m)?p.vacc_m.toFixed(3):'—';
    const ts=p.epsilon_time_utc?p.epsilon_time_utc.slice(11,23):'—';
    tr.innerHTML='<td>'+idx+'</td><td><button class="btn-sm btn-outline" onclick="event.stopPropagation();setStart('+idx+')">起点</button> <button class="btn-sm btn-outline btn-danger" onclick="event.stopPropagation();setEnd('+idx+')">终点</button> <button class="btn-sm btn-outline" onclick="event.stopPropagation();toggleExclude('+idx+')">排除</button></td><td>'+p.latitude_deg.toFixed(6)+'</td><td>'+p.longitude_deg.toFixed(6)+'</td><td>'+fix+'</td><td>'+cd+'</td><td>'+ha+'</td><td>'+va+'</td><td>'+ts+'</td>';
    tr.addEventListener('click',()=>clickTableRow(i));
    tb.appendChild(tr);
  }
}
function highlightTableRow(idx){clearTableHighlight();const rows=document.querySelectorAll('#pointTable tbody tr');if(rows[idx])rows[idx].classList.add('active')}
function clearTableHighlight(){document.querySelectorAll('#pointTable tbody tr.active').forEach(el=>el.classList.remove('active'))}
function clickTableRow(idx){zoomToPoint(idx);highlightTableRow(idx)}

// ===================================================================
// UI ACTIONS
// ===================================================================
function setStart(idx){document.getElementById('startIndex').value=idx;renderDistance()}
function setEnd(idx){document.getElementById('endIndex').value=idx;renderDistance()}
function toggleExclude(idx){
  const el=document.getElementById('excludeIndices');
  const s=el.value?new Set(el.value.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n))):new Set();
  s.has(idx)?s.delete(idx):s.add(idx);
  el.value=Array.from(s).sort((a,b)=>a-b).join(',');recalc();
}

function recalc(){
  if(!gCandidates.length)return;
  const src=document.getElementById('positionSource').value,mft=document.getElementById('minFix').value;
  const mhat=document.getElementById('maxHacc').value,mvat=document.getElementById('maxVacc').value;
  const msgt=document.getElementById('maxSegmentM').value,ext=document.getElementById('excludeIndices').value,int=document.getElementById('includeIndices').value;
  const mfc=mft?(FIX_NAMES[mft]!=null?+mft:parseInt(mft,10)):null;
  const mha=mhat?parseFloat(mhat):null,mva=mvat?parseFloat(mvat):null,mse=msgt?parseFloat(msgt):null;
  const exc=parseRanges(ext),inc=parseRanges(int);

  const selected=selectSource(gCandidates,src);
  const filtered=applyFilters(selected,{includeIndices:inc&&inc.size>0?inc:null,excludeIndices:exc&&exc.size>0?exc:null,minFixCode:isFinN(mfc)?mfc:null,maxHacc:isFinN(mha)?mha:null,maxVacc:isFinN(mva)?mva:null,maxSegmentM:isFinN(mse)?mse:null});
  assignDist(filtered);gPoints=filtered;
  // Clamp start/end indices BEFORE rendering (fix: out-of-bounds in routeDist)
  const se=document.getElementById('startIndex'),ee=document.getElementById('endIndex');
  if(gPoints.length){
    if(parseInt(se.value,10)>gPoints.length||parseInt(se.value,10)<1)se.value=1;
    if(parseInt(ee.value,10)>gPoints.length||parseInt(ee.value,10)<1)ee.value=gPoints.length;
  }else{se.value=1;ee.value=1}
  renderMap();renderTable();renderDistance();renderStats();
}

function renderDistance(){
  const n=gPoints.length;
  const si=Math.max(1,Math.min(parseInt(document.getElementById('startIndex').value,10)||1,n||1));
  const ei=Math.max(1,Math.min(parseInt(document.getElementById('endIndex').value,10)||n,n));
  // Sync clamped values back to inputs
  document.getElementById('startIndex').value=si;document.getElementById('endIndex').value=ei;
  const segEl=document.getElementById('segmentDist'),totEl=document.getElementById('totalDist');
  if(!n){segEl.textContent='—';totEl.textContent='—';return}
  // Redraw segment overlays
  if(gTrackSelected){gMap.removeLayer(gTrackSelected);gTrackSelected=null}
  if(gStartMarker){gMap.removeLayer(gStartMarker);gStartMarker=null}
  if(gEndMarker){gMap.removeLayer(gEndMarker);gEndMarker=null}
  const ll=gPoints.map(p=>[p.latitude_deg,p.longitude_deg]),lo=Math.max(0,Math.min(si,ei)-1),hi=Math.min(n,Math.max(si,ei));
  if(lo<hi){
    gTrackSelected=L.polyline(ll.slice(lo,hi),{color:'#e67300',weight:3,opacity:0.9}).addTo(gMap);
    const sp=gPoints[lo];gStartMarker=L.circleMarker([sp.latitude_deg,sp.longitude_deg],{radius:8,color:'#2a7d2a',fillColor:'#4caf50',fillOpacity:0.8,weight:2}).addTo(gMap);
    gStartMarker.bindTooltip('起点 #'+(lo+1),{direction:'top'});
    const ep=gPoints[hi-1];gEndMarker=L.circleMarker([ep.latitude_deg,ep.longitude_deg],{radius:8,color:'#c33',fillColor:'#e74c3c',fillOpacity:0.8,weight:2}).addTo(gMap);
    gEndMarker.bindTooltip('终点 #'+hi,{direction:'top'});
  }
  const total=n?gPoints[n-1].cumulative_distance_m:0,segment=routeDist(gPoints,si,ei);
  segEl.textContent=isFinite(segment)?segment.toFixed(3)+' m':'—';totEl.textContent=isFinite(total)?total.toFixed(3)+' m':'—';
  document.querySelectorAll('#pointTable tbody tr.start-row,#pointTable tbody tr.end-row').forEach(el=>el.classList.remove('start-row','end-row'));
  document.querySelectorAll('#pointTable tbody tr').forEach(tr=>{const idx=parseInt(tr.dataset.index,10)+1;if(idx===si)tr.classList.add('start-row');if(idx===ei)tr.classList.add('end-row')});
}

function renderStats(){
  const el=document.getElementById('statsGrid');
  if(!gPoints.length){el.innerHTML='';return}
  el.innerHTML=[
    ['解析总记录',gStats.rawRecords||0],['有效帧',gStats.validFrames||0],['错误帧',gStats.badFrames||0],
    ['坐标候选',gStats.coordinateCandidates||0],['来源选择',gStats.selectedCandidates||0],
    ['来源',gStats.autoSource||'—'],['过滤后点数',gPoints.length],['丢弃点数',gStats.removedCount||0]
  ].map(([l,v]) => '<div class="stat-item"><span class="stat-label">'+l+'</span><span class="stat-value">'+v+'</span></div>').join('');
}

// ===================================================================
// FILE LOADING
// ===================================================================
function readFileProg(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onprogress=function(e){if(e.lengthComputable)updateProgress((e.loaded/e.total)*25,'读取文件… '+(e.loaded/e.total*100).toFixed(0)+'%')};
    r.onload=function(){res(new Uint8Array(r.result))};r.onerror=rej;r.readAsArrayBuffer(file);
  });
}

async function loadFromFile(file){
  if(!file||gIsLoading)return;gIsLoading=true;
  setStatus('加载 '+file.name+'…');document.getElementById('fileName').textContent=file.name;updateProgress(0,'准备…');
  try{
    const bytes=await readFileProg(file);
    updateProgress(27,'解析记录格式…');await sleep(0);
    gRecords=parseRecords(file.name,bytes);
    if(!gRecords.length)throw new Error('没有解析到任何记录');
    updateProgress(55,'找到 '+gRecords.length+' 条记录');await sleep(0);
    gCandidates=decodePoints(gRecords,function(pct,msg){updateProgress(55+pct*0.35,msg);});
    if(!gCandidates.length)throw new Error('没有解析到有效坐标点');
    updateProgress(91,'应用过滤…');await sleep(0);
    document.getElementById('startIndex').value=1;document.getElementById('endIndex').value=gCandidates.length;
    recalc();
    updateProgress(100,'完成');await sleep(300);hideProgress();
    if(gPoints.length){
      gMap.fitBounds(gPoints.map(p=>[p.latitude_deg,p.longitude_deg]),{padding:[40,40]});
      setStatus('✓ '+file.name+'：'+gPoints.length+' 轨迹点，'+gStats.rawRecords+' 条记录，'+gStats.validFrames+' 有效帧');
    }else{
      setStatus('✓ 解析完成，但所有点被过滤掉了',false);
    }
  }catch(err){
    hideProgress();setStatus('✗ '+(err.message||String(err)),false);
    gRecords=[];gCandidates=[];gPoints=[];gStats={};
    renderMap();renderTable();renderStats();
  }finally{gIsLoading=false}
}

function chooseEpsilonFile(files){
  const list=Array.from(files);
  const prefs=[
    f=>f.webkitRelativePath.replaceAll('\\','/').endsWith('/raw/epsilon.dat'),
    f=>f.webkitRelativePath.replaceAll('\\','/').endsWith('/sensors/epsilon_raw.dat'),
    f=>f.name==='epsilon.dat',f=>f.name==='epsilon_raw.dat',
  ];
  for(const pred of prefs){const f=list.find(pred);if(f)return f}
  return null;
}

// ===================================================================
// EVENT BINDINGS
// ===================================================================
document.getElementById('sessionInput').addEventListener('change',function(e){
  const file=chooseEpsilonFile(e.target.files);
  if(!file){setStatus('所选文件夹中没有找到 raw/epsilon.dat 或 sensors/epsilon_raw.dat',false);return}
  loadFromFile(file);
});
document.getElementById('datInput').addEventListener('change',function(e){
  if(!e.target.files.length)return;loadFromFile(e.target.files[0]);
});
window.addEventListener('resize',()=>{if(gMap)gMap.invalidateSize()});

// ===================================================================
// INIT
// ===================================================================
initMap();
</script>
