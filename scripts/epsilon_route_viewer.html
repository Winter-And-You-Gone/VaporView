<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>EPSILON 原始轨迹查看器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;color:#222;background:#f5f5f5}
#app{display:flex;height:100vh;overflow:hidden}
#map{flex:1;min-width:0;position:relative}
#panel{width:380px;display:flex;flex-direction:column;background:#fff;border-left:1px solid #ddd;overflow:hidden}
.panel-section{padding:8px 12px;border-bottom:1px solid #eee;flex-shrink:0}
.panel-section label{display:inline-block;font-size:12px;color:#555;margin-right:4px}
.panel-section select,.panel-section input[type=number],.panel-section input[type=text]{font-size:12px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;outline:none;width:auto;max-width:100%}
.panel-section input[type=number]{width:55px}
.panel-section select:focus,.panel-section input:focus{border-color:#4a90d9}
.btn{display:inline-block;font-size:12px;padding:4px 10px;border:1px solid #4a90d9;border-radius:3px;background:#4a90d9;color:#fff;cursor:pointer;text-align:center;white-space:nowrap}
.btn:hover{background:#3a7bc8}
.btn-sm{font-size:11px;padding:2px 6px}
.btn-outline{background:transparent;color:#4a90d9}
.btn-outline:hover{background:#e8f0fe}
.btn-danger{border-color:#d9534f;background:#d9534f}
.btn-danger:hover{background:#c9302c}
.btn-danger.btn-outline{background:transparent;color:#d9534f}
.btn-danger.btn-outline:hover{background:#fce4e4}
.file-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.file-row input[type=file]{position:absolute;left:-9999px;top:0;width:0;height:0;opacity:0}
.file-btn{font-size:12px;padding:4px 10px;border:1px solid #bbb;border-radius:3px;background:#f0f0f0;cursor:pointer;color:#555}
.file-btn:hover{background:#e0e0e0;color:#222}
.file-name{font-size:11px;color:#888;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#progressContainer{display:none;margin-top:4px}
#progressBar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
#progressFill{height:100%;width:0%;background:#4a90d9;border-radius:3px;transition:width .15s ease}
#progressStep{font-size:11px;color:#666;margin-top:2px}
#status{padding:6px 12px;font-size:12px;flex-shrink:0;min-height:24px}
#status.ok{color:#2a7d2a}
#status.error{color:#c33}
.filter-row{display:flex;flex-wrap:wrap;gap:4px 8px;margin-bottom:4px}
.filter-row .filter-item{display:inline-flex;align-items:center;gap:2px}
.filter-row .filter-item label{font-size:11px;color:#666;white-space:nowrap}
.filter-row .filter-item input,.filter-row .filter-item select{font-size:11px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px}
.stats-grid .stat-item{display:flex;justify-content:space-between}
.stats-grid .stat-label{color:#888}
.stats-grid .stat-value{font-weight:500;font-variant-numeric:tabular-nums}
.dist-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dist-row .dist-label{font-size:12px;color:#555;white-space:nowrap}
.dist-row .dist-value{font-size:14px;font-weight:600;color:#222;font-variant-numeric:tabular-nums}
.dist-row input[type=number]{width:50px}
#tableWrap{flex:1 1 0;overflow:auto;min-height:0}
#pointTable{width:100%;border-collapse:collapse;font-size:11px}
#pointTable th{position:sticky;top:0;background:#f8f8f8;z-index:1;padding:4px 3px;border-bottom:2px solid #ddd;text-align:center;font-weight:600;color:#555;white-space:nowrap}
#pointTable td{padding:3px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap}
#pointTable tr:hover td{background:#f0f7ff}
#pointTable tr.active td{background:#fff3cd!important}
#pointTable tr.start-row td{background:#d4edda}
#pointTable tr.end-row td{background:#f8d7da}
#pointTable td .btn-sm{margin:0 1px;font-size:10px;padding:1px 4px}
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div id="status" class="ok">选择文件或文件夹开始</div>
    <div class="panel-section">
      <div class="file-row">
        <button class="file-btn" onclick="document.getElementById('sessionInput').click()">📁 选记录文件夹</button>
        <button class="file-btn" onclick="document.getElementById('datInput').click()">📄 选DAT文件</button>
        <span class="file-name" id="fileName"></span>
        <input type="file" id="sessionInput" webkitdirectory multiple>
        <input type="file" id="datInput" accept=".dat">
      </div>
      <div id="progressContainer">
        <div id="progressBar"><div id="progressFill"></div></div>
        <div id="progressStep">准备...</div>
      </div>
    </div>
    <div class="panel-section">
      <div class="filter-row">
        <div class="filter-item">
          <label>底图</label>
          <select id="providerSelect" onchange="switchProvider()">
            <option value="tianditu_vec">天地图矢量</option>
            <option value="tianditu_img">天地图卫星</option>
            <option value="amap_vec">高德矢量</option>
            <option value="amap_img">高德卫星</option>
            <option value="osm">OpenStreetMap</option>
          </select>
        </div>
        <div class="filter-item">
          <label>Key</label>
          <input type="text" id="tiandituKey" value="5a0d3293c900281a37417b2e4d4d3676" size="12" onchange="switchProvider()">
        </div>
      </div>
      <div class="filter-row" style="margin-top:2px">
        <div class="filter-item"><label>来源</label><select id="positionSource" onchange="recalc()"><option value="auto">auto</option><option value="geodetic">geodetic</option><option value="system">system</option><option value="both">both</option></select></div>
        <div class="filter-item"><label>min-fix</label><select id="minFix" onchange="recalc()"><option value="">—</option><option value="3">3D</option><option value="4">DGPS</option><option value="5">RTK_FLOAT</option><option value="6">RTK_FIXED</option><option value="7">STATIC</option><option value="8">PPP</option></select></div>
        <div class="filter-item"><label>hacc</label><input type="number" id="maxHacc" step="0.01" min="0" placeholder="不限" size="4" onchange="recalc()"></div>
        <div class="filter-item"><label>vacc</label><input type="number" id="maxVacc" step="0.01" min="0" placeholder="不限" size="4" onchange="recalc()"></div>
      </div>
      <div class="dist-row">
        <span class="dist-label">线宽</span><input type="range" id="lineWeight" min="1" max="6" step="0.5" value="2" oninput="renM()" style="width:60px"> <span id="lwLabel" style="font-size:11px;color:#666">2</span>
        <span class="dist-label">点径</span><input type="range" id="pointRadius" min="0" max="6" step="0.5" value="3" oninput="renM()" style="width:60px"> <span id="prLabel" style="font-size:11px;color:#666">3</span>
        <span id="zoomDisplay" style="font-size:11px;color:#888;margin-left:8px"></span>
        <div class="filter-item"><label>跳点(m)</label><input type="number" id="maxSegmentM" step="1" min="0" placeholder="不限" size="4" onchange="recalc()"></div>
        <div class="filter-item"><label>排除</label><input type="text" id="excludeIndices" placeholder="如5,8-10" size="8" onchange="recalc()"></div>
        <div class="filter-item"><label>包含</label><input type="text" id="includeIndices" placeholder="如1,3-5" size="8" onchange="recalc()"></div>
        <button class="btn btn-sm" onclick="recalc()">🔄 重算</button>
      </div>
    </div>
    <div class="panel-section">
      <div class="dist-row">
        <span class="dist-label">起点</span><input type="number" id="startIndex" value="1" min="1" onchange="renderDistance()">
        <span class="dist-label">终点</span><input type="number" id="endIndex" value="1" min="1" onchange="renderDistance()">
        <button class="btn btn-sm" onclick="zoomToFitSelected()">📍 适配</button>
        <button class="btn btn-sm btn-outline" onclick="exportCsv()">📥 CSV</button>
      </div>
      <div class="dist-row"><span class="dist-label">区段:</span><span class="dist-value" id="segmentDist">—</span><span class="dist-label" style="margin-left:12px">全程:</span><span class="dist-value" id="totalDist">—</span></div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>
    <div id="tableWrap"><table id="pointTable"><thead><tr><th>#</th><th>操作</th><th>纬度</th><th>经度</th><th>Fix</th><th>累积(m)</th><th>hacc</th><th>vacc</th><th>UTC</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>

<script>
// == CONSTANTS =================================================================
const FC=0xFC,FT=0xFD,SRCE=1,UM='VVRAWDAT',LM='VVEPSRAW',URM=0x44525756,LRM=0x524D5549;
const ER=6371000;
const FN={0:'NO_GPS',1:'NO_FIX',2:'2D',3:'3D',4:'DGPS',5:'RTK_FLOAT',6:'RTK_FIXED',7:'STATIC',8:'PPP',9:'RTK_DUAL'};
const PN={0x40:'IMU',0x41:'AHRS',0x42:'INS_GPS',0x50:'SYS_STATE',0x51:'UNIX_TIME',0x52:'FORMATTED_TIME',0x59:'RAW_GNSS',0x5A:'SATELLITES',0x5C:'GEODETIC_POS',0x5D:'ECEF_POS',0xF0:'MAVLINK_TUNNEL'};
let gRecs=[],gCands=[],gPts=[],gStat={},gLoading=false;
let gLMap=null,gLyr=[],gMk=[],gTL=null,gTS=null,gSM=null,gEM=null,gHC=null;
let gEngine='leaflet',gAMap=null,gARdy=false,gAH=null,gAOl=[];
let gLW=2;

// == HELPERS ====================================================================
function r16(dv,o){return dv.getUint16(o,true)}
function r32(dv,o){return dv.getUint32(o,true)}
function rF(dv,o){return dv.getFloat32(o,true)}
function rDbl(dv,o){return dv.getFloat64(o,true)}
function r2d(r){return r*180/Math.PI}
function slp(m){return new Promise(r=>setTimeout(r,m))}
function fN(v){return v!=null&&Number.isFinite(v)}
// CRC
function crc8(b,s,l){let c=0;for(let i=s;i<s+l;i++){c^=b[i];for(let j=0;j<8;j++){c=(c&1)?((c>>1)^0x8C):(c>>1);c&=0xFF}}return c}
function crc16(b,s,l){let c=0;for(let i=s;i<s+l;i++){c^=b[i]<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c}
// FDILink
function pf(pay){if(pay.byteLength<8)return null;const b=new Uint8Array(pay),ps=b[2],es=ps+8;if(b[0]!==FC||pay.byteLength!==es||b[es-1]!==FT)return null;if(crc8(b,0,4)!==b[4])return null;if(crc16(b,7,ps)!==((b[5]<<8)|b[6]))return null;return{pid:b[1],sn:b[3],ps,view:new DataView(pay.buffer,pay.byteOffset+7,ps)}}
function pn(id){return'0x'+id.toString(16).toUpperCase().padStart(2,'0')+' '+(PN[id]||'UNK')}
function tu(u){if(!u)return'';const m=Math.floor(u/1000),e=u%1000;return new Date(m).toISOString().replace('Z',String(e).padStart(3,'0')+'Z')}
function ei(s,u){return s!=null?tu(s*1000000+(u||0)):''}
function vll(lat,lon){return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180&&!(Math.abs(lat)<1e-8&&Math.abs(lon)<1e-8)}
function ftu(pay){if(pay.byteLength<14)return null;const p=new DataView(pay.buffer,pay.byteOffset,pay.byteLength);try{const u=r32(p,0),y=r16(p,4),b8=new Uint8Array(pay.buffer,pay.byteOffset,pay.byteLength);const ms=Date.UTC(y,b8[8]-1,b8[9],b8[11],b8[12],b8[13],Math.floor(u/1000));return ms*1000+(u%1000)}catch(e){return null}}

// == RECORD ITERATORS ============================================================
function iur(fn,b){
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  if(b.byteLength<20)throw new Error(fn+': 文件头过短');
  const v=r32(dv,8),h=r32(dv,12),si=r16(dv,16);
  if(si!==SRCE)throw new Error(fn+': source_id='+si);
  let o=h;const r=[];
  while(o+36<=b.byteLength){
    const mk=r32(dv,o);if(mk!==URM)throw new Error(fn+': marker 错');
    const rh=r32(dv,o+4),ht=Number(dv.getBigUint64(o+8,1)),ps=r32(dv,o+16),rs=r16(dv,o+20),rt=r16(dv,o+22),fl=r32(dv,o+24),sq=Number(dv.getBigUint64(o+28,1));
    const po=o+rh;if(po+ps>b.byteLength)throw new Error(fn+': payload 不完整');
    if(rs===SRCE)r.push({sf:fn,rf:'unified_v'+v,seq:sq,hts:ht,rt,fl,pay:b.slice(po,po+ps),ro:o,po});
    o=po+ps;
  }
  return r;
}
function ilr(fn,b){
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  const v=r32(dv,8),h=r32(dv,12);let o=h,sq=0;const r=[];
  while(o+20<=b.byteLength){
    const mk=r32(dv,o);if(mk!==LRM)throw new Error(fn+': legacy marker 错');
    const ps=r32(dv,o+4),ht=Number(dv.getBigUint64(o+8,1)),ft=b[o+16],sr=b[o+17],po=o+20;
    if(po+ps>b.byteLength)throw new Error(fn+': payload 不完整');
    r.push({sf:fn,rf:'legacy_epsilon_v'+v,seq:sq,hts:ht,rt:ft,fl:sr,pay:b.slice(po,po+ps),ro:o,po});o=po+ps;sq++;
  }
  return r;
}
function ifs(fn,b){let o=0,sq=0;const r=[];while(o+8<=b.byteLength){while(o<b.byteLength&&b[o]!==FC)o++;if(o+8>b.byteLength)break;const ps=b[o+2],fs=ps+8;if(o+fs>b.byteLength)break;const p=b.slice(o,o+fs);if(p[p.byteLength-1]===FT){r.push({sf:fn,rf:'fdilink_stream',seq:sq,hts:0,rt:b[o+1],fl:b[o+3],pay:p,ro:o,po:o});sq++;o+=fs}else o++}return r}
function prec(fn,b){const m=new TextDecoder('ascii').decode(b.slice(0,8));if(m===UM)return iur(fn,b);if(m===LM)return ilr(fn,b);return ifs(fn,b)}

// == DECODE ======================================================================
function np(rec,frm,st,src){
  const fc=st.gnss_fix_code!=null?st.gnss_fix_code:null;
  return{sf:rec.sf,rf:rec.rf,rs:rec.seq,hts:rec.hts,htu:tu(rec.hts),ph:pn(frm.pid),pn:PN[frm.pid]||'UNK',ps:src,sn:frm.sn,us:st.utc_unix_s!=null?st.utc_unix_s:null,um:st.utc_microseconds!=null?st.utc_microseconds:null,etu:ei(st.utc_unix_s,st.utc_microseconds),lat:null,lon:null,hgt:null,sd:0,cd:0,gfc:fc,gf:fc!=null?(FN[fc]||''):'',gs:st.gnss_satellites!=null?st.gnss_satellites:null,hd:st.hdop!=null?st.hdop:null,vd:st.vdop!=null?st.vdop:null,ha:st.hacc_m!=null?st.hacc_m:null,va:st.vacc_m!=null?st.vacc_m:null,ls:st.lat_std_m!=null?st.lat_std_m:null,lns:st.lon_std_m!=null?st.lon_std_m:null,hs:st.height_std_m!=null?st.height_std_m:null,da:st.diff_age_s!=null?st.diff_age_s:null,vn:st.vel_n_mps!=null?st.vel_n_mps:null,ve:st.vel_e_mps!=null?st.vel_e_mps:null,vdm:st.vel_d_mps!=null?st.vel_d_mps:null,nn:st.ned_n_m!=null?st.ned_n_m:null,ne:st.ned_e_m!=null?st.ned_e_m:null,nd:st.ned_d_m!=null?st.ned_d_m:null,rd:st.roll_deg!=null?st.roll_deg:null,pd:st.pitch_deg!=null?st.pitch_deg:null,yd:st.yaw_deg!=null?st.yaw_deg:null,ssb:st.system_status_bits!=null?st.system_status_bits:null,fsb:st.filter_status_bits!=null?st.filter_status_bits:null,usb:st.update_status_bits!=null?st.update_status_bits:null,ro:rec.ro,po:rec.po,pi:0,spi:0}
}
function dcp(recs,prog){const st={},cs=[];let vf=0,bf=0;for(let i=0;i<recs.length;i++){if(prog&&i>0&&i%500===0)prog(62+(i/recs.length)*23,'解码…'+i+'/'+recs.length);const r=recs[i],f=pf(r.pay);if(!f){bf++;continue}vf++;const p=f.view,pid=f.pid,sz=f.ps;if(pid===0x42&&sz>=72){st.nn=rF(p,24);st.ne=rF(p,28);st.nd=rF(p,32);st.vn=rF(p,36);st.ve=rF(p,40);st.vdm=rF(p,44)}else if(pid===0x50&&sz>=14){st.ssb=r16(p,0);st.fsb=r16(p,2);st.usb=r16(p,4);st.utc_unix_s=r32(p,6);st.utc_microseconds=r32(p,10);st.gnss_fix_code=(st.fsb>>4)&0x0F;if(sz>=50){st.vn=rF(p,38);st.ve=rF(p,42);st.vdm=rF(p,46)}if(sz>=78){st.rd=r2d(rF(p,66));st.pd=r2d(rF(p,70));st.yd=r2d(rF(p,74))}if(sz>=102){st.ls=rF(p,90);st.lns=rF(p,94);st.hs=rF(p,98)}if(sz>=38){const pt=np(r,f,st,'system_state');pt.lat=r2d(rDbl(p,14));pt.lon=r2d(rDbl(p,22));pt.hgt=rDbl(p,30);cs.push(pt)}}else if(pid===0x51&&sz>=8){st.utc_unix_s=r32(p,0);st.utc_microseconds=r32(p,4)}else if(pid===0x52&&sz>=14){const ut=ftu(new Uint8Array(p.buffer,p.byteOffset,p.byteLength));if(ut!=null){st.utc_unix_s=Math.floor(ut/1000000);st.utc_microseconds=ut%1000000}}else if(pid===0x59&&sz>=74){st.utc_unix_s=r32(p,0);st.utc_microseconds=r32(p,4);st.ls=rF(p,44);st.lns=rF(p,48);st.hs=rF(p,52);st.da=rF(p,64);st.gnss_fix_code=r16(p,72)&0x0F}else if(pid===0x5A&&sz>=9){st.hd=rF(p,0);st.vd=rF(p,4);st.gnss_satellites=new Uint8Array(p.buffer,p.byteOffset,p.byteLength)[8]}else if(pid===0x5C&&sz>=32){const pt=np(r,f,st,'geodetic_pos');pt.lat=r2d(rDbl(p,0));pt.lon=r2d(rDbl(p,8));pt.hgt=rDbl(p,16);pt.ha=rF(p,24);pt.va=rF(p,28);st.hacc_m=pt.ha;st.vacc_m=pt.va;cs.push(pt)}}gStat.rr=recs.length;gStat.vf=vf;gStat.bf=bf;gStat.cc=cs.length;return cs}

// == SOURCE / FILTER / DIST ======================================================
function sels(cs,req){if(req==='auto')req=cs.some(p=>p.ps==='geodetic_pos')?'geodetic':'system';let sl;if(req==='geodetic')sl=cs.filter(p=>p.ps==='geodetic_pos');else if(req==='system')sl=cs.filter(p=>p.ps==='system_state');else sl=Array.from(cs);sl.forEach((p,i)=>{p.spi=i+1});gStat.sc=sl.length;gStat.as=req;return sl}
function prs(t){if(!t||!t.trim())return null;const s=new Set();t.split(',').forEach(p=>{const n=p.trim();if(!n)return;if(n.indexOf('-')>=0){const[a,b]=n.split('-',2);const lo=Math.min(+a,+b),hi=Math.max(+a,+b);for(let i=lo;i<=hi;i++)s.add(i)}else{const v=parseInt(n,10);if(!isNaN(v))s.add(v)}});return s}
function af(ps,f){let fl=[];const inc=f.include,exc=f.exclude,mfx=f.mfx,mha=f.mha,mva=f.mva,mse=f.mse;for(const p of ps){if(inc&&inc.size>0&&!inc.has(p.spi))continue;if(exc&&exc.has(p.spi))continue;if(!vll(p.lat,p.lon))continue;if(mfx!=null&&(p.gfc==null||p.gfc<mfx))continue;if(fN(mha)&&fN(p.ha)&&p.ha>mha)continue;if(fN(mva)&&fN(p.va)&&p.va>mva)continue;fl.push(p)}if(fN(mse)&&fl.length>0){const j=[fl[0]];for(let i=1;i<fl.length;i++){if(hav(j[j.length-1],fl[i])<=mse)j.push(fl[i])}fl=j}gStat.fc=fl.length;gStat.rc=ps.length-fl.length;return fl}
function hav(a,b){const l1=a.lat*Math.PI/180,l2=b.lat*Math.PI/180,dl=l2-l1,dn=(b.lon-a.lon)*Math.PI/180,h=Math.sin(dl/2)**2+Math.cos(l1)*Math.cos(l2)*Math.sin(dn/2)**2;return ER*2*Math.atan2(Math.sqrt(h),Math.sqrt(Math.max(0,1-h)))}
function ad(l){let c=0;for(let i=0;i<l.length;i++){const p=l[i];p.pi=i+1;p.sd=i===0?0:hav(l[i-1],p);c+=p.sd;p.cd=c}}
function rd(l,si,ei){if(!l||!l.length)return 0;const lo=Math.min(si,ei),hi=Math.max(si,ei);if(lo===hi||hi>l.length)return 0;return l[hi-1].cd-l[lo-1].cd}

// == CSV ========================================================================

const GA=6378245.0,GE=0.00669342162296594323;
function tx(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
function ty(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
function wgs2gcj(lat,lon){var dl=tx(lon-105,lat-35),dn=ty(lon-105,lat-35);var ra=lat/180*Math.PI;var m=Math.sin(ra);m=1-GE*m*m;var s=Math.sqrt(m);dl=(dl*180)/((GA*(1-GE))/(m*s)*Math.PI);dn=(dn*180)/(GA/s*Math.cos(ra)*Math.PI);return{lat:lat+dl,lon:lon+dn}}
function apPts(pts){return pts.map(function(p){var g=wgs2gcj(p.lat,p.lon);return{...p,lat:g.lat,lon:g.lon}})}

  if(!file||gLoading)return;gLoading=true;
  ss('加载 '+file.name+'…');document.getElementById('fileName').textContent=file.name;up(0,'准备…');
  try{
    const b=await rFP(file);up(27,'解析记录格式…');await slp(0);
    gRecs=prec(file.name,b);if(!gRecs.length)throw new Error('没有记录');
    up(55,'找到 '+gRecs.length+' 条记录');await slp(0);
    gCands=dcp(gRecs,function(p,m){up(55+p*0.35,m)});if(!gCands.length)throw new Error('没有坐标点');
    up(91,'过滤…');await slp(0);
    document.getElementById('startIndex').value=1;document.getElementById('endIndex').value=gCands.length;
    rc();up(100,'完成');await slp(300);hp();
    if(gPts.length){
      ztFS();ss('✓ '+file.name+'：'+gPts.length+' 点，'+gStat.rr+' 记录，'+gStat.vf+' 有效帧');
    }else{
      // 降级：auto 来源无匹配时尝试 both
      document.getElementById('positionSource').value='both';rc();
      if(gPts.length){
        ss('✓ 已切换为 both 来源，'+gPts.length+' 点，'+gStat.rr+' 记录',false);
      }else{
        ss('✗ 候选'+gStat.cc+' 丢弃'+gStat.rc+' — 检查 min-fix/hacc/vacc/排除设置',false);
      }
    }
  }catch(e){hp();ss('✗ '+(e.message||String(e)),false);gRecs=[];gCands=[];gPts=[];gStat={};renM();rT();rS()}finally{gLoading=false}
}
function cEF(fls){
  const list=Array.from(fls);
  for(const pred of [f=>f.webkitRelativePath.replaceAll('\\','/').endsWith('/raw/epsilon.dat'),f=>f.webkitRelativePath.replaceAll('\\','/').endsWith('/sensors/epsilon_raw.dat'),f=>f.name==='epsilon.dat',f=>f.name==='epsilon_raw.dat']){const f=list.find(pred);if(f)return f}
  const dat=list.filter(f=>f.name.endsWith('.dat'));return dat.length?dat[0]:null;
}

// == EVENTS ======================================================================
document.getElementById('sessionInput').addEventListener('change',function(e){const f=cEF(e.target.files);if(!f){ss('所选文件夹中没有找到 raw/epsilon.dat',false);return}lFF(f)});
document.getElementById('datInput').addEventListener('change',function(e){if(!e.target.files.length)return;lFF(e.target.files[0])});
window.addEventListener('resize',()=>{if(gEngine==='leaflet'&&gLMap)gLMap.invalidateSize()});

// == INIT =======================================================================
initMap();
</script>
