<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaporView 地面网关</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <div class="product">VaporView</div>
        <h1>地面网关</h1>
      </div>
      <span id="gateway-origin" class="mono"></span>
    </header>

    <section aria-label="连接与查询" class="connection">
      <form id="token-form" autocomplete="off">
        <label for="token">入站令牌</label>
        <div class="actions">
          <input id="token" type="password" autocomplete="off" spellcheck="false" maxlength="256" required>
          <button id="apply-token" type="submit" class="primary">应用令牌</button>
        </div>
        <span id="token-state" class="hint" role="status">等待输入</span>
      </form>
      <div class="actions">
        <button id="refresh-status" type="button" disabled>查询状态</button>
        <button id="refresh-latest" type="button" disabled>查询最新测量</button>
      </div>
    </section>
    <p id="api-feedback" class="feedback" role="status"></p>

    <dl class="status-grid" aria-label="网关和遥测状态">
      <div><dt>HTTPS 网关</dt><dd id="gateway-state">等待查询</dd></div>
      <div><dt>机地数传</dt><dd id="link-state">未知</dd></div>
      <div><dt>SkyCore 状态</dt><dd id="telemetry-state">未知</dd></div>
      <div><dt>设备标识</dt><dd id="device-id" class="mono">—</dd></div>
      <div><dt>录制</dt><dd id="recording-state">—</dd></div>
      <div><dt>Session</dt><dd id="session-name" class="mono">—</dd></div>
    </dl>

    <div class="details-grid">
      <section class="panel" aria-labelledby="command-title">
        <h2 id="command-title">SkyCore 命令</h2>
        <div class="actions">
          <button id="command-status" data-command="10" type="button" disabled>读取状态</button>
          <button id="command-start" data-command="1" type="button" disabled>启动／恢复记录</button>
          <button id="command-stop" data-command="3" type="button" disabled>停止记录</button>
        </div>
        <p id="command-feedback" class="feedback" role="status">等待下发</p>
        <dl class="command-detail">
          <dt>命令 ID</dt><dd id="command-id" class="mono">—</dd>
          <dt>受理</dt><dd id="command-accepted">—</dd>
          <dt>最终回执</dt><dd id="command-result">—</dd>
          <dt>Session ID</dt><dd id="command-session" class="mono">—</dd>
        </dl>
        <button id="command-check" type="button" disabled>查询当前命令回执</button>
      </section>
      <section class="panel" aria-labelledby="device-title">
        <h2 id="device-title">设备状态</h2>
        <div class="table-wrap device-table" tabindex="0" aria-label="设备状态表">
          <table>
            <thead><tr><th scope="col">设备 ID</th><th scope="col">状态码</th><th scope="col">错误码</th><th scope="col">接收计数</th></tr></thead>
            <tbody id="device-rows"><tr><td colspan="4">暂无设备状态</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="panel stream" aria-labelledby="stream-title">
      <div class="section-head">
        <div><h2 id="stream-title">实时测量</h2><p class="hint">峰值沿用采集端单位，实时列表保留最近 50 条。</p></div>
        <div class="actions">
          <button id="connect-stream" type="button" class="primary" disabled>连接 WSS</button>
          <button id="disconnect-stream" type="button" disabled>断开</button>
        </div>
      </div>
      <p id="stream-state" class="feedback" role="status">未连接</p>
      <dl class="stream-meta">
        <div><dt>最近事件</dt><dd id="stream-event">—</dd></div>
        <div><dt>入口累计丢帧</dt><dd id="stream-dropped" class="mono">—</dd></div>
      </dl>
      <p id="latest-measurement" class="latest" role="status">HTTPS 最新测量 · 尚未查询</p>
      <div class="table-wrap stream-table" tabindex="0" aria-label="实时测量表">
        <table>
          <thead><tr><th scope="col">事件序号</th><th scope="col">帧序号</th><th scope="col">来源</th><th scope="col">通道</th><th scope="col">峰值</th><th scope="col">UTC 时间</th><th scope="col">质量位</th></tr></thead>
          <tbody id="measurement-rows"><tr><td colspan="7">等待实时测量</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
